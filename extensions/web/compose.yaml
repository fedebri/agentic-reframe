name: agentic-reframe

x-web-environment: &web-environment
  WEB_AUTH_MODE: cloudflare
  WEB_DATA_ROOT: /data
  WEB_COOKIE_SECURE: "1"
  WEB_SECRET_KEY: ${WEB_SECRET_KEY:?Set WEB_SECRET_KEY in deployment.env}
  WEB_ACCESS_TEAM_DOMAIN: ${WEB_ACCESS_TEAM_DOMAIN:?Set the Cloudflare Access team domain}
  WEB_ACCESS_AUD: ${WEB_ACCESS_AUD:?Set the Cloudflare Access application AUD}
  WEB_ADMIN_EMAILS: ${WEB_ADMIN_EMAILS:-}
  WEB_LIVE_ENABLED: ${WEB_LIVE_ENABLED:-0}
  WEB_RUN_BUDGET_USD: ${WEB_RUN_BUDGET_USD:-0.10}
  WEB_USER_BUDGET_USD: ${WEB_USER_BUDGET_USD:-0.50}
  WEB_TOTAL_BUDGET_USD: ${WEB_TOTAL_BUDGET_USD:-5.00}

services:
  web:
    image: agentic-reframe-web:local
    build:
      context: ../..
      dockerfile: extensions/web/Dockerfile
    environment: *web-environment
    volumes:
      - data:/data
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: agentic-reframe-web:local
    command: ["python", "-m", "extensions.web.worker"]
    environment:
      <<: *web-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10m

  cloudflared:
    image: cloudflare/cloudflared:2026.10.2
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set the tunnel token in deployment.env}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    name: agentic-reframe-data
