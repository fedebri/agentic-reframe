<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agentic Reframe{% endblock %}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="{{ url_for('static', filename='readability.css') }}">
</head>
<body>
  <header>
    <div class="wordmark-row"><h1><a href="{{ url_for('home') }}">Agentic Reframe</a></h1><span class="status-dot" aria-hidden="true"></span></div>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('home') }}">Home</a>
      | <a href="{{ url_for('projects') }}">My projects</a>
      {% if is_admin %} | <a href="{{ url_for('admin') }}">Administration</a>{% endif %}
    </nav>
    {% if project_choices %}
    <form method="post" action="{{ url_for('projects') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <p><label>Project <select name="workspace_id" required>
        {% if not project_id %}<option value="" disabled selected>Choose a project</option>{% endif %}
        {% for item in project_choices %}<option value="{{ item.id }}"{% if item.id == project_id %} selected{% endif %}>{{ item.name }} ({{ item.id[:8] }})</option>{% endfor %}
      </select></label> <button type="submit">Open project</button></p>
    </form>
    {% endif %}
    {% if signed_in and identity_email %}<div class="account">{{ identity_email }} <form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sign out</button></form></div>{% endif %}
    <hr>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Derver / Independent research</footer>
</body>
</html>
