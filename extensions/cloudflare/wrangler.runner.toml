name = "agentic-reframe-runner"
main = "dist/extensions/cloudflare/runner.py"
base_dir = "dist"
find_additional_modules = true
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.yaml", "**/*.css", "**/*.js"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[[r2_buckets]]
binding = "RESEARCH"
bucket_name = "agentic-reframe-private"

[vars]
WEB_LIVE_ENABLED = "1"

[observability]
enabled = false
