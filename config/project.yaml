project:
  id: agentic-design-tutorial
  name: Agentic Reframe
  version: 2.0.0

paths:
  brief: docs/brief.md
  outputs: outputs/v2
  ledger: outputs/v2/ledger/events.jsonl

workflow:
  analyst_prompt: agents/analyst.md
  critic_prompt: agents/critic.md
  critic_policy: requested

# Rates are local budget estimates, not provider-side spending limits.
model:
  name: gpt-6-luna
  reasoning_effort: none
  timeout_seconds: 60
  max_retries: 1
  max_input_bytes: 60000
  max_input_tokens: 20000
  max_output_tokens: 4000
  input_usd_per_million: 0.10
  output_usd_per_million: 0.50

exercises:
  - id: frame_challenge
    order: 1
    source: exercises/1_frame_challenge.md
    produces: [framed_challenge_candidates, altitude_risks, audience_hypotheses]
  - id: align_impact_goals
    order: 2
    source: exercises/2_align_impact_goals.md
    produces: [impact_goals, success_signals, goal_conflicts]
  - id: align_participatory_approach
    order: 3
    source: exercises/3_align_participatory.md
    produces: [participation_plan, engagement_risks, consent_and_power_notes]
  - id: secondary_research
    order: 4
    source: exercises/4_secondary_research.md
    produces: [landscape_facts, constraint_facts, research_questions]
  - id: power_mapping
    order: 5
    source: exercises/5_power_mapping.md
    produces: [stakeholder_power_map, power_asymmetries, governance_questions]
  - id: resource_flow
    order: 6
    source: exercises/6_resource_flow.md
    produces: [resource_flow_map, bottlenecks, dependency_edges]
  - id: extremes_and_mainstreams
    order: 7
    source: exercises/7_extremes_mainstreams.md
    produces: [audience_segments, edge_case_needs, recruiting_plan]
  - id: analogous_inspiration
    order: 8
    source: exercises/8_analogous_inspiration.md
    produces: [analogy_sources, transferable_patterns, analogy_limits]
  - id: photojournal
    order: 9
    source: exercises/9_photojournal.md
    produces: [observed_contexts, environmental_clues, photojournal_template]
  - id: five_whys
    order: 10
    source: exercises/10_five_whys.md
    produces: [root_cause_chains, assumption_chains, stopping_conditions]
  - id: interviews
    order: 11
    source: exercises/11_interviews.md
    produces: [interview_insights, quote_evidence, interview_templates]
  - id: project_plan
    order: 12
    source: exercises/12_project_plan.md
    produces: [timeline, staffing_needs, budget_questions, fieldwork_plan]
  - id: value_proposition_canvas
    order: 13
    source: exercises/13_value_proposition_canvas.md
    produces: [persona_maps, jobs_to_be_done, pains, gains]
