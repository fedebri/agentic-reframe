name: Web extension checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Offline tests and container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install core and optional web dependencies
        run: python -m pip install -e '.[dev]' -r extensions/web/requirements.txt
      - name: Check the extension
        run: |
          python -m ruff check extensions/web tests/local/test_web_extension.py tests/local/test_web_deployment.py
          python -m ruff format --check extensions/web tests/local/test_web_extension.py tests/local/test_web_deployment.py
          python -m pytest -q
      - name: Validate Compose without displaying configuration values
        env:
          WEB_SECRET_KEY: fictional-ci-cookie-key
          WEB_ACCESS_TEAM_DOMAIN: https://fictional.cloudflareaccess.com
          WEB_ACCESS_AUD: fictional-audience
          CLOUDFLARE_TUNNEL_TOKEN: fictional-not-a-token
        run: docker compose -f extensions/web/compose.yaml config --quiet
      - name: Add fictional publication-boundary sentinels
        run: |
          mkdir -p extensions/web/.data
          printf '%s\n' FICTIONAL_DO_NOT_SHIP > extensions/web/.data/private-test.txt
          printf '%s\n' FICTIONAL_DO_NOT_SHIP > extensions/web/deployment.env
      - name: Build the runtime image
        run: docker build -f extensions/web/Dockerfile -t agentic-reframe-web:ci .
      - name: Check the image and private-file boundary
        run: >-
          docker run --rm --entrypoint python agentic-reframe-web:ci -c
          "from pathlib import Path; from extensions.web.app import create_app;
          assert not Path('/app/extensions/web/deployment.env').exists();
          assert not Path('/app/extensions/web/.data/private-test.txt').exists();
          assert not Path('/app/.git').exists();
          assert Path('/app/docs/brief.md').read_text().startswith('Deployment scaffold.');
          assert create_app().test_client().get('/health').status_code == 200"
