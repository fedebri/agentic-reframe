name: Web extension checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Offline tests and Workers bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install core and optional web dependencies
        run: python -m pip install -e '.[dev]' -r extensions/web/requirements.txt
      - name: Check the extension
        run: |
          python -m ruff check extensions/web extensions/cloudflare tests/workers tests/local/test_web_extension.py tests/local/test_web_deployment.py tests/local/test_cloudflare_extension.py tests/local/test_cloudflare_identity.py tests/local/test_cloudflare_runner.py
          python -m ruff format --check extensions/web extensions/cloudflare tests/workers tests/local/test_web_extension.py tests/local/test_web_deployment.py tests/local/test_cloudflare_extension.py tests/local/test_cloudflare_identity.py tests/local/test_cloudflare_runner.py
          python -m pytest -q
          python -m extensions.cloudflare.build
